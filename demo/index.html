<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>simple-mindmap demo</title>
<style>
  :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, system-ui, "Helvetica Neue", sans-serif; font-size: 14px; }
  body { margin: 0; display: grid; grid-template-rows: auto 1fr; height: 100vh; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #8884; }
  header h1 { font-size: 15px; margin: 0 8px 0 0; }
  label { display: inline-flex; gap: 6px; align-items: center; }
  main { display: grid; grid-template-columns: 1fr 340px; min-height: 0; }
  #map { min-height: 0; position: relative; }
  aside { border-left: 1px solid #8884; display: flex; flex-direction: column; min-height: 0; padding: 8px; gap: 8px; overflow: auto; }
  aside h2 { font-size: 13px; margin: 4px 0 0; }
  textarea { width: 100%; min-height: 110px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; box-sizing: border-box; }
  pre { margin: 0; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 220px; overflow: auto; background: #8881; padding: 6px; border-radius: 6px; }
  #log { list-style: none; margin: 0; padding: 0; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; max-height: 260px; overflow: auto; }
  #log li { padding: 2px 0; border-bottom: 1px solid #8882; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; grid-template-rows: 60vh auto; } aside { border-left: 0; border-top: 1px solid #8884; } }
</style>
</head>
<body>
<header>
  <h1>simple-mindmap</h1>
  <label>Data <select id="sample">
    <option value="architecture.json">Architecture (links, statuses)</option>
    <option value="statuses-tones.json">Every status and tone</option>
    <option value="text.json">Text handling</option>
    <option value="large-2000.json">2 000 nodes</option>
    <option value="invalid">Invalid data</option>
  </select></label>
  <label>Mode <select id="mode"><option>view</option><option selected>select</option><option>edit</option></select></label>
  <label>Theme <select id="theme"><option value="">OS</option><option>light</option><option>dark</option><option value="custom">custom palette (tokens)</option></select></label>
  <label>Status icons <select id="icons"><option value="">built-in</option><option value="mixed" selected>mixed levels (path, Lucide, images, element)</option></select></label>
  <label><input type="checkbox" id="autoApply" checked> apply edit intents</label>
</header>
<main>
  <div id="map"></div>
  <aside>
    <h2>Selected</h2>
    <pre id="selected">-</pre>
    <h2>Apply operations (JSON array)</h2>
    <textarea id="ops">[{ "op": "add", "parent": "root", "node": { "id": "new1", "title": "Added by apply", "status": "open" } }]</textarea>
    <div class="row"><button id="apply" type="button">Apply</button><button id="undo" type="button">Reload data</button></div>
    <pre id="result">-</pre>
    <h2>Export</h2>
    <div class="row">
      <button type="button" data-export="json">JSON</button><button type="button" data-export="outline">Outline</button>
      <button type="button" data-export="mermaid">Mermaid</button><button type="button" data-export="svg">SVG (download)</button>
    </div>
    <pre id="export">-</pre>
    <h2>Status style (setStatusStyle)</h2>
    <div class="row">
      <select id="styleKey"><option>open</option><option>pending</option><option selected>decided</option><option>parked</option><option>blocked</option><option>superseded</option></select>
      <select id="styleColor"><option value="">(keep colour)</option><option>green</option><option>amber</option><option>red</option><option>blue</option><option>purple</option><option>grey</option><option value="#d63384">#d63384 (raw)</option></select>
      <select id="styleIcon">
        <option value="">(keep icon)</option><option value="shape">built-in shape</option><option value="symbol">symbol ★</option><option value="path">path</option>
        <option value="hand">icon (hand-written)</option><option value="lucide">Lucide via icon</option><option value="lucideRender">Lucide via render</option>
        <option value="data">data: image</option><option value="https">URL image (http/https)</option><option value="element">custom element (render)</option>
      </select>
      <button id="styleApply" type="button">Apply</button>
    </div>
    <pre id="styleResult">-</pre>
    <h2>Status legend (statusIcon) and export levels</h2>
    <div id="legend" class="row"></div>
    <pre id="levels">-</pre>
    <h2>Events</h2>
    <ul id="log"></ul>
  </aside>
</main>
<script type="module">
import { createMindmap, statusIcon, DEFAULT_STATUSES } from "../src/mindmap.js";

// lucide is a devDependency (npm ci); the library itself never imports it.
let L = null;
try { L = await import("../node_modules/lucide/dist/esm/lucide.mjs"); } catch { L = null; }

const DATA_IMG = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12"><rect x="1" y="1" width="10" height="10" rx="3" fill="#8250df"/></svg>');
// a URL image (here a file next to this page; an https: URL takes the same path): drawn on the map, not embedded in the export
const URL_IMG = new URL("status.svg", import.meta.url).href;
// a custom element, drawn through render() (an HTML element: wrapped in <foreignObject> on the map)
if (!customElements.get("demo-badge")) {
  customElements.define("demo-badge", class extends HTMLElement {
    connectedCallback() { this.style.cssText = "display:block;width:10px;height:10px;margin:1px;border-radius:2px;background:#e8710a"; }
  });
}
const ICON = {
  shape: (k) => ({ shape: DEFAULT_STATUSES[k] ? DEFAULT_STATUSES[k].shape : "open" }),
  symbol: () => ({ symbol: "\u2605" }),
  path: () => ({ path: "M6 1L11 6L6 11L1 6Z" }),
  hand: () => ({ icon: { viewBox: "0 0 12 12", stroke: true, nodes: [["circle", { cx: 6, cy: 6, r: 4.5 }], ["path", { d: "M6 3.5V6.5" }], ["circle", { cx: 6, cy: 8.5, r: ".6", fill: "currentColor" }]] } }),
  lucide: () => (L ? { icon: { nodes: L.CircleCheck, stroke: true } } : { symbol: "L?" }),
  lucideRender: () => (L ? { render: () => L.createElement(L.Hourglass, { width: 12, height: 12 }), symbol: "\u231B" } : { symbol: "L?" }),
  data: () => ({ image: DATA_IMG }),
  https: () => ({ image: URL_IMG, symbol: "W" }),
  element: () => ({ render: () => document.createElement("demo-badge"), symbol: "E" }),
};
// one level per status: shows what the map draws and what the export falls back to
function mixedStatuses() {
  return {
    open: {},
    pending: { ...ICON.path() },
    decided: { ...ICON.lucide() },
    parked: { ...ICON.https() },
    blocked: { ...ICON.element() },
    superseded: { ...ICON.data() },
  };
}
const PALETTE = { mode: "light", tokens: { bg: "#fbf7ef", "node-bg": "#fffdf8", "node-border": "#d9c9a8", text: "#3b2f1e", "edge-0": "#b5651d", "edge-1": "#2e8b57", "edge-2": "#4169e1", "edge-3": "#8b008b" } };
function themeValue() { const v = $("theme").value; return v === "custom" ? PALETTE : v || null; }
let current = {};
// the level the map draws vs the level the static export uses (same rules as the library, for display only)
function levels(s, forExport) {
  if (!forExport && typeof s.render === "function") return "render";
  if (s.image && (!forExport || String(s.image).startsWith("data:"))) return "image";
  if (s.icon || s.path) return "icon";
  if (s.shape) return "shape";
  return s.symbol ? "symbol" : "dot";
}
function showLegend() {
  const eff = {};
  for (const [k, v] of Object.entries(current)) eff[k] = v;
  $("legend").replaceChildren(...Object.keys(eff).map((k) => {
    const span = document.createElement("span");
    const img = document.createElement("img");
    img.width = 12; img.height = 12; img.alt = "";
    img.src = "data:image/svg+xml," + encodeURIComponent(statusIcon(k, eff) || "");
    span.append(img, " " + k);
    return span;
  }));
}

const $ = (id) => document.getElementById(id);
const EVENTS = ["select", "open", "action", "toggle", "view", "viewport", "search", "intent", "invalid", "error"];
let mm = null, seq = 0;

function log(name, payload) {
  const li = document.createElement("li");
  li.textContent = `${name} ${JSON.stringify(payload).slice(0, 300)}`;
  $("log").prepend(li);
  while ($("log").childElementCount > 200) $("log").lastElementChild.remove();
}

async function load() {
  const name = $("sample").value;
  const data = name === "invalid"
    ? { root: { id: "a", title: "Root", children: [{ id: "a", title: "Banner" }] } }
    : await (await fetch(`../test/fixtures/v1/${name}`)).json();
  const state = mm ? mm.getState() : null;
  if (mm) mm.destroy();
  current = $("icons").value === "mixed" ? mixedStatuses() : {};
  mm = createMindmap($("map"), {
    data, mode: $("mode").value, theme: themeValue(),
    statuses: Object.keys(current).length ? current : undefined,
    state: state && name === load.last ? state : null,
    actions: [
      { id: "copy-id", label: "Copy internal id", icon: L ? { nodes: L.Copy, stroke: true } : "#" },
      { id: "log-node", label: "Log node", icon: "\u2192" },
    ],
    badge: (n) => (n.meta && n.meta.by ? { symbol: "•", label: `changed by ${n.meta.by}` } : null),
  });
  load.last = name;
  showLegend();
  for (const e of EVENTS) mm.on(e, (p) => log(e, p));
  mm.on("select", ({ id }) => { $("selected").textContent = JSON.stringify(mm.getNode(id), null, 2); });
  mm.on("action", ({ action, id }) => {
    if (action === "copy-id" && navigator.clipboard) navigator.clipboard.writeText(id).catch(() => {});
    if (action === "log-node") log("node", mm.getNode(id));
  });
  mm.on("intent", (op) => {
    if (!$("autoApply").checked) return;
    const o = structuredClone(op);
    if (o.op === "add" && !o.node.id) o.node.id = `new-${Date.now().toString(36)}-${++seq}`;
    $("result").textContent = JSON.stringify(mm.apply([o]), null, 2);
  });
}

$("sample").addEventListener("change", load);
$("mode").addEventListener("change", load);
$("theme").addEventListener("change", () => { $("result").textContent = "setTheme -> " + JSON.stringify(mm.setTheme(themeValue())); });
$("icons").addEventListener("change", () => { load.last = null; load(); });
$("styleApply").addEventListener("click", () => {
  const key = $("styleKey").value, style = {};
  if ($("styleColor").value) style.color = $("styleColor").value;
  if ($("styleIcon").value) Object.assign(style, { render: null, image: null, icon: null, path: null, shape: null, symbol: null }, ICON[$("styleIcon").value](key));
  const r = mm.setStatusStyle(key, style);
  if (r.ok) { current = { ...current, [key]: { ...(current[key] || {}), ...style } }; showLegend(); }
  $("styleResult").textContent = JSON.stringify(r);
});
$("undo").addEventListener("click", () => { load.last = null; load(); });
$("apply").addEventListener("click", () => {
  let ops;
  try { ops = JSON.parse($("ops").value); } catch (e) { $("result").textContent = "Not JSON: " + e.message; return; }
  $("result").textContent = JSON.stringify(mm.apply(ops), null, 2);
});
for (const b of document.querySelectorAll("[data-export]")) {
  b.addEventListener("click", () => {
    const fmt = b.dataset.export;
    const out = mm.export(fmt);
    if (out === null) { $("export").textContent = "(no valid data)"; return; }
    if (fmt === "svg") {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([out], { type: "image/svg+xml" }));
      a.download = "mindmap.svg";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      $("export").textContent = `SVG: ${out.length} bytes`;
      const eff = { ...DEFAULT_STATUSES };
      for (const [k, v] of Object.entries(current)) eff[k] = Object.values(v).some((x) => x !== null && x !== undefined) ? { ...v } : eff[k];
      $("levels").textContent = Object.entries(eff).map(([k, s]) => {
        const ui = levels(s, false), file = levels(s, true);
        return `${k}: map ${ui}, export ${file}${ui === file ? "" : " (fell back)"}`;
      }).join("\n");
    } else $("export").textContent = out;
  });
}
load();
</script>
</body>
</html>
